services:
  postgres:
    image: postgres:16
    container_name: aes-postgres
    environment:
      POSTGRES_USER: aes
      POSTGRES_PASSWORD: aes
      POSTGRES_DB: aes_lab
    ports:
      - "5432:5432"
    volumes:
      - aes_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aes-redis
    ports:
      - "6379:6379"

  observation-service:
    build:
      context: ./execution/services/observation
    container_name: aes-observation-service
    environment:
      DATABASE_URL: postgresql://aes:aes@postgres:5432/aes_lab
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  evidence-service:
    build:
      context: ./execution/services/evidence
    container_name: aes-evidence-service
    environment:
      DATABASE_URL: postgresql://aes:aes@postgres:5432/aes_lab
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
      - observation-service

  assessment-service:
    build:
      context: ./execution/services/assessment
    container_name: aes-assessment-service
    environment:
      DATABASE_URL: postgresql://aes:aes@postgres:5432/aes_lab
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - redis
      - evidence-service

volumes:
  aes_postgres_data:
