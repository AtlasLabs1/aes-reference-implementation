services:
  postgres:
    image: postgres:16
    container_name: aes-postgres
    environment:
      POSTGRES_USER: aes
      POSTGRES_PASSWORD: aes
      POSTGRES_DB: aes_lab
    ports:
      - "5432:5432"
    volumes:
      - aes_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aes-redis
    ports:
      - "6379:6379"

  observation-service:
    build:
      context: .
      dockerfile: execution/services/observation/Dockerfile
    container_name: aes-observation-service
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  evidence-service:
    build:
      context: .
      dockerfile: execution/services/evidence/Dockerfile
    container_name: aes-evidence-service
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
      - observation-service

volumes:
  aes_postgres_data:
